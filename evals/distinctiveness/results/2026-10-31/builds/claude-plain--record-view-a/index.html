<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halvorsen Freight Systems · Accounts · Relay CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --border: #e3e6eb;
    --border-strong: #cfd4dc;
    --text: #1b1f26;
    --text-2: #4d5562;
    --text-3: #7a8291;
    --accent: #2f5bea;
    --accent-hover: #2249c9;
    --accent-soft: #edf1fe;
    --green: #17804d;
    --green-soft: #e6f5ec;
    --amber: #a8620a;
    --amber-soft: #fdf3e2;
    --red: #c4321f;
    --red-soft: #fdecea;
    --violet: #6a3fc8;
    --violet-soft: #f1ecfc;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(20, 25, 35, .05);
    --focus: 0 0 0 3px rgba(47, 91, 234, .28);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    color: var(--text);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: none; box-shadow: var(--focus); border-radius: 6px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* App chrome */
  .topbar {
    height: 52px; background: #161a22; color: #e9ecf1;
    display: flex; align-items: center; gap: 28px; padding: 0 24px;
  }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; letter-spacing: -.01em; }
  .brand-mark { width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(135deg, #5b82ff, #2f5bea); }
  .nav { display: flex; gap: 4px; }
  .nav a { color: #aab2c0; padding: 6px 10px; border-radius: 6px; font-weight: 500; }
  .nav a:hover { color: #fff; background: rgba(255,255,255,.06); text-decoration: none; }
  .nav a[aria-current="page"] { color: #fff; background: rgba(255,255,255,.1); }
  .topbar-user { margin-left: auto; display: flex; align-items: center; gap: 10px; color: #aab2c0; font-size: 13px; }

  .page { max-width: 1280px; margin: 0 auto; padding: 20px 24px 64px; }
  .crumbs { font-size: 13px; color: var(--text-3); margin-bottom: 14px; }
  .crumbs a { color: var(--text-2); }

  /* Header */
  .account-head {
    display: flex; align-items: flex-start; gap: 16px; flex-wrap: wrap;
    margin-bottom: 18px;
  }
  .logo {
    width: 52px; height: 52px; border-radius: 12px; flex: none;
    background: #0f3d3a; color: #fff; display: grid; place-items: center;
    font-weight: 700; font-size: 18px; letter-spacing: .02em;
  }
  .head-main { flex: 1; min-width: 240px; }
  .head-main h1 { font-size: 22px; line-height: 1.25; margin: 2px 0 6px; letter-spacing: -.015em; }
  .head-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; color: var(--text-2); font-size: 13px; }
  .head-meta .sep { color: var(--border-strong); }
  .head-actions { display: flex; gap: 8px; }

  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 500;
    background: #eef0f3; color: var(--text-2); white-space: nowrap;
  }
  .chip.green { background: var(--green-soft); color: var(--green); }
  .chip.amber { background: var(--amber-soft); color: var(--amber); }
  .chip.red { background: var(--red-soft); color: var(--red); }
  .chip.blue { background: var(--accent-soft); color: var(--accent); }
  .chip.violet { background: var(--violet-soft); color: var(--violet); }
  .chip .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    height: 34px; padding: 0 14px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--border-strong); background: var(--surface);
    font-weight: 500; white-space: nowrap;
  }
  .btn:hover { background: #f7f8fa; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: var(--accent-hover); }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--text-2); }
  .btn.ghost:hover { background: #eef0f3; }
  .btn.sm { height: 30px; padding: 0 10px; font-size: 13px; }
  .btn svg { width: 15px; height: 15px; }

  /* Stats */
  .stats {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px;
    background: var(--border); border: 1px solid var(--border); border-radius: var(--radius);
    overflow: hidden; margin-bottom: 20px; box-shadow: var(--shadow);
  }
  .stat { background: var(--surface); padding: 14px 18px; }
  .stat-label { font-size: 12px; color: var(--text-3); font-weight: 500; }
  .stat-value { font-size: 20px; font-weight: 600; letter-spacing: -.015em; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .stat-sub { font-size: 12px; color: var(--text-2); margin-top: 1px; }
  .health-bar { height: 6px; border-radius: 3px; background: #eef0f3; margin-top: 8px; overflow: hidden; }
  .health-bar span { display: block; height: 100%; background: var(--green); border-radius: 3px; }

  /* Layout */
  .layout { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 20px; align-items: start; }
  .col { display: grid; gap: 20px; min-width: 0; }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
  }
  .card-head {
    display: flex; align-items: center; gap: 10px; padding: 14px 18px;
    border-bottom: 1px solid var(--border);
  }
  .card-head h2 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: -.005em; }
  .card-head .count { color: var(--text-3); font-weight: 500; font-size: 13px; }
  .card-head .spacer { flex: 1; }
  .card-body { padding: 16px 18px; }

  /* Details */
  .detail-group + .detail-group { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border); }
  .detail-group h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); margin: 0 0 10px; font-weight: 600; }
  dl.details { margin: 0; display: grid; grid-template-columns: 112px 1fr; gap: 8px 12px; }
  dl.details dt { color: var(--text-3); }
  dl.details dd { margin: 0; overflow-wrap: anywhere; }
  .empty-val { color: var(--text-3); font-style: italic; }
  .description { color: var(--text-2); margin: 0; white-space: pre-wrap; }

  /* Form */
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field { display: grid; gap: 4px; }
  .field.full { grid-column: 1 / -1; }
  .field label { font-size: 12px; font-weight: 500; color: var(--text-2); }
  .field .req { color: var(--red); }
  .input {
    width: 100%; height: 34px; padding: 0 10px; border-radius: 7px;
    border: 1px solid var(--border-strong); background: #fff;
  }
  textarea.input { height: auto; min-height: 84px; padding: 8px 10px; resize: vertical; }
  select.input { padding-right: 6px; }
  .input:focus { outline: none; border-color: var(--accent); box-shadow: var(--focus); }
  .input[aria-invalid="true"] { border-color: var(--red); }
  .input[aria-invalid="true"]:focus { box-shadow: 0 0 0 3px rgba(196, 50, 31, .2); }
  .field-error { font-size: 12px; color: var(--red); }
  .field-error:empty { display: none; }
  .form-actions {
    display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px;
    border-top: 1px solid var(--border); background: #fafbfc;
    border-radius: 0 0 var(--radius) var(--radius);
    position: sticky; bottom: 0;
  }
  .form-actions .hint { margin-right: auto; align-self: center; font-size: 12px; color: var(--text-3); }
  .form-section-label { grid-column: 1 / -1; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); font-weight: 600; margin-top: 6px; }
  .form-section-label:first-child { margin-top: 0; }

  /* Contacts */
  .contacts { width: 100%; border-collapse: collapse; }
  .contacts th {
    text-align: left; font-size: 12px; font-weight: 500; color: var(--text-3);
    padding: 9px 18px; border-bottom: 1px solid var(--border); background: #fafbfc;
  }
  .contacts td { padding: 11px 18px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .contacts tr:last-child td { border-bottom: 0; }
  .contacts tbody tr:hover { background: #fafbfc; }
  .person { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%; flex: none; display: grid; place-items: center;
    font-size: 12px; font-weight: 600; color: #fff;
  }
  .person-name { font-weight: 500; display: flex; align-items: center; gap: 6px; }
  .person-title { color: var(--text-3); font-size: 13px; }
  .primary-badge { font-size: 11px; font-weight: 600; color: var(--accent); background: var(--accent-soft); padding: 0 6px; border-radius: 4px; }
  .contact-links { display: grid; gap: 1px; font-size: 13px; }
  .contact-links a { color: var(--text-2); }
  .contact-links a:hover { color: var(--accent); }
  .muted { color: var(--text-3); }
  .nowrap { white-space: nowrap; }

  /* Activity */
  .composer { padding: 14px 18px; border-bottom: 1px solid var(--border); display: grid; gap: 10px; }
  .composer-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .composer-row .input { width: auto; }
  .composer-row .spacer { flex: 1; }
  .seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 8px; padding: 2px; background: #f7f8fa; }
  .seg button {
    border: 0; background: transparent; padding: 4px 10px; border-radius: 6px; cursor: pointer;
    font-size: 13px; color: var(--text-2); font-weight: 500;
  }
  .seg button[aria-pressed="true"] { background: #fff; color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .seg button .n { color: var(--text-3); font-weight: 400; margin-left: 3px; }

  .filters { padding: 10px 18px; border-bottom: 1px solid var(--border); display: flex; gap: 6px; flex-wrap: wrap; }
  .filter {
    border: 1px solid var(--border); background: #fff; border-radius: 999px;
    padding: 3px 11px; font-size: 13px; cursor: pointer; color: var(--text-2);
  }
  .filter:hover { border-color: var(--border-strong); }
  .filter[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: #fff; }
  .filter .n { opacity: .65; margin-left: 4px; }

  .timeline-section { padding: 4px 18px 8px; }
  .timeline-label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); font-weight: 600; padding: 12px 0 4px; }
  .timeline { list-style: none; margin: 0; padding: 0; }
  .event { display: grid; grid-template-columns: 32px 1fr; gap: 12px; position: relative; padding: 10px 0; }
  .event::before {
    content: ""; position: absolute; left: 15.5px; top: 44px; bottom: -10px;
    width: 1px; background: var(--border);
  }
  .event:last-child::before { display: none; }
  .event-icon { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; }
  .event-icon svg { width: 15px; height: 15px; }
  .ev-call .event-icon { background: var(--green-soft); color: var(--green); }
  .ev-email .event-icon { background: var(--accent-soft); color: var(--accent); }
  .ev-meeting .event-icon { background: var(--violet-soft); color: var(--violet); }
  .ev-note .event-icon { background: var(--amber-soft); color: var(--amber); }
  .ev-deal .event-icon, .ev-update .event-icon { background: #eef0f3; color: var(--text-2); }
  .event-top { display: flex; gap: 10px; align-items: baseline; }
  .event-title { font-weight: 500; flex: 1; min-width: 0; }
  .event-time { color: var(--text-3); font-size: 12px; white-space: nowrap; }
  .event-body { color: var(--text-2); margin-top: 2px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .event-meta { color: var(--text-3); font-size: 12px; margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
  .event.upcoming .event-icon { box-shadow: inset 0 0 0 1.5px currentColor; }
  .empty { padding: 28px 18px; text-align: center; color: var(--text-3); }

  /* Toast */
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px);
    background: #161a22; color: #fff; padding: 10px 16px; border-radius: 8px;
    font-size: 13px; box-shadow: 0 8px 24px rgba(0,0,0,.18);
    opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 1000px) {
    .layout { grid-template-columns: 1fr; }
    .stats { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 720px) {
    .page { padding: 16px 14px 48px; }
    .topbar { padding: 0 14px; gap: 14px; }
    .nav { display: none; }
    .contacts thead { display: none; }
    .contacts, .contacts tbody, .contacts tr, .contacts td { display: block; }
    .contacts tr { padding: 12px 18px; border-bottom: 1px solid var(--border); }
    .contacts tr:last-child { border-bottom: 0; }
    .contacts td { padding: 2px 0 2px 42px; border: 0; }
    .contacts td:first-child { padding-left: 0; padding-bottom: 6px; }
    .contacts td[data-label]::before { content: attr(data-label) " · "; color: var(--text-3); font-size: 12px; }
    .contacts td.c-links::before { display: none; }
    .form-grid { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="brand-mark" aria-hidden="true"></span>Relay</div>
  <nav class="nav" aria-label="Primary">
    <a href="#">Home</a>
    <a href="#" aria-current="page">Accounts</a>
    <a href="#">Contacts</a>
    <a href="#">Deals</a>
    <a href="#">Reports</a>
  </nav>
  <div class="topbar-user">
    <span>Priya Raman</span>
    <span class="avatar" style="background:#2f5bea;width:28px;height:28px;font-size:11px" aria-hidden="true">PR</span>
  </div>
</header>

<main class="page">
  <nav class="crumbs" aria-label="Breadcrumb"><a href="#">Accounts</a> / <span id="crumb-name"></span></nav>

  <section class="account-head" aria-labelledby="account-name">
    <div class="logo" id="logo" aria-hidden="true"></div>
    <div class="head-main">
      <h1 id="account-name"></h1>
      <div class="head-meta" id="head-meta"></div>
    </div>
    <div class="head-actions">
      <button class="btn" type="button" id="log-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Log activity
      </button>
      <button class="btn primary" type="button" id="edit-btn" aria-controls="details-card">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        Edit details
      </button>
    </div>
  </section>

  <section class="stats" aria-label="Account summary" id="stats"></section>

  <div class="layout">
    <div class="col">
      <section class="card" id="details-card" aria-labelledby="details-title">
        <div class="card-head">
          <h2 id="details-title">Account details</h2>
          <span class="spacer"></span>
          <button class="btn ghost sm" type="button" id="edit-inline-btn">Edit</button>
        </div>
        <div id="details-view" class="card-body"></div>
        <form id="details-form" novalidate hidden></form>
      </section>
    </div>

    <div class="col">
      <section class="card" aria-labelledby="contacts-title">
        <div class="card-head">
          <h2 id="contacts-title">Contacts <span class="count" id="contacts-count"></span></h2>
        </div>
        <table class="contacts">
          <thead>
            <tr><th scope="col">Name</th><th scope="col">Role</th><th scope="col">Contact</th><th scope="col">Last contacted</th></tr>
          </thead>
          <tbody id="contacts-body"></tbody>
        </table>
      </section>

      <section class="card" aria-labelledby="activity-title">
        <div class="card-head">
          <h2 id="activity-title">Activity</h2>
        </div>
        <form class="composer" id="composer" aria-label="Log activity">
          <div class="composer-row">
            <div class="seg" role="group" aria-label="Activity type" id="composer-type">
              <button type="button" data-type="note" aria-pressed="true">Note</button>
              <button type="button" data-type="call" aria-pressed="false">Call</button>
              <button type="button" data-type="email" aria-pressed="false">Email</button>
              <button type="button" data-type="meeting" aria-pressed="false">Meeting</button>
            </div>
            <label class="sr-only" for="composer-contact">Related contact</label>
            <select class="input" id="composer-contact" style="height:30px"></select>
          </div>
          <label class="sr-only" for="composer-text">Activity details</label>
          <textarea class="input" id="composer-text" rows="2" style="min-height:60px" placeholder="Add a note about this account…"></textarea>
          <div class="composer-row">
            <span class="muted" style="font-size:12px">⌘/Ctrl + Enter to save</span>
            <span class="spacer"></span>
            <button class="btn primary sm" type="submit">Log note</button>
          </div>
        </form>
        <div class="filters" role="group" aria-label="Filter activity" id="filters"></div>
        <div id="timeline"></div>
      </section>
    </div>
  </div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {

  let nextId = 100;
  const activities = [

  const usd = (n, compact) => new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", maximumFractionDigits: compact ? 1 : 0, notation: compact ? "compact" : "standard" }).format(n);
  const int = (n) => new Intl.NumberFormat("en-US").format(n);
  const initials = (name) => name.split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join("");
  const contactById = (id) => contacts.find(c => c.id === id);
  const parseDate = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const fmtDate = (d, opts = { month: "short", day: "numeric", year: "numeric" }) => d.toLocaleDateString("en-US", opts);
  const fmtFull = (d) => d.toLocaleString("en-US", { weekday: "short", month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" });
  const startOfDay = (d) => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
  const dayDiff = (d) => Math.round((startOfDay(d) - startOfDay(new Date())) / DAY);

  function relTime(d) {
    const diff = d - Date.now();
    const time = d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
    if (diff > 0) {
      const days = dayDiff(d);
      if (days === 0) return `Today, ${time}`;
      if (days === 1) return `Tomorrow, ${time}`;
      return `${fmtDate(d, { weekday: "short", month: "short", day: "numeric" })}, ${time}`;
    }
    const mins = Math.round(-diff / 60000);
    if (mins < 1) return "Just now";
    if (mins < 60) return `${mins} min ago`;
    const days = -dayDiff(d);
    if (days === 0) return `${Math.round(mins / 60)} hr ago`;
    if (days === 1) return `Yesterday, ${time}`;
    if (days < 7) return `${days} days ago`;
    return fmtDate(d, d.getFullYear() === new Date().getFullYear() ? { month: "short", day: "numeric" } : undefined);
  }

  const fieldDefs = FIELDS.filter(f => f.key);

  function renderForm() {

          if (f.section) return `<div class="form-section-label">${esc(f.section)}</div>`;
          const id = `f-${f.key}`, err = `${id}-err`;
          const v = toInputValue(f, account[f.key]);
          const common = `id="${id}" name="${f.key}" class="input" aria-describedby="${err}" ${f.required ? "required" : ""}`;
          let control;
          if (f.type === "select") {
            const opts = f.options.includes(v) || !v ? f.options : [v, ...f.options];
            control = `<select ${common}>${f.key === "industry" ? '<option value="">—</option>' : ""}${opts.map(o => `<option${o === v ? " selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
          } else if (f.type === "textarea") {
            control = `<textarea ${common} rows="4" maxlength="1000">${esc(v)}</textarea>`;
          } else {
            const t = { url: "text", tel: "tel", number: "text", money: "text", date: "date" }[f.type] || "text";
            const extra = f.type === "number" || f.type === "money" ? 'inputmode="numeric"' : f.type === "url" ? 'inputmode="url" autocomplete="url"' : f.type === "tel" ? 'autocomplete="tel"' : "";
            control = `<input type="${t}" ${common} value="${esc(v)}" ${extra} ${f.placeholder ? `placeholder="${esc(f.placeholder)}"` : ""}>`;
          }
          return `<div class="field${f.full ? " full" : ""}">
            <label for="${id}">${esc(f.label)}${f.required ? ' <span class="req" aria-hidden="true">*</span>' : ""}</label>

  // Parse & validate the form. Returns { values, errors }.
  function readForm() {
    const form = $("#details-form");
    const values = {}, errors = {};
    for (const f of fieldDefs) {
      let raw = form.elements[f.key].value.trim();
      if (f.required && !raw) { errors[f.key] = `${f.label} is required.`; continue; }
      if (f.type === "url" && raw) {
        const withScheme = /^https?:\/\//i.test(raw) ? raw : `https://${raw}`;
        try {
          const u = new URL(withScheme);
          if (!u.hostname.includes(".")) throw 0;
          raw = u.href.replace(/\/$/, "");
        } catch { errors[f.key] = "Enter a valid web address, e.g. example.com"; continue; }
      }
      if (f.type === "tel" && raw && (!/^[\d\s()+.\-x]+$/i.test(raw) || raw.replace(/\D/g, "").length < 7)) {
        errors[f.key] = "Enter a valid phone number."; continue;
      }
      if (f.type === "number") {
        if (raw === "") { values[f.key] = ""; continue; }
        const n = Number(raw.replace(/,/g, ""));
        if (!Number.isInteger(n) || n < 0) { errors[f.key] = "Enter a whole number."; continue; }
        values[f.key] = n; continue;
      }
      if (f.type === "money") {
        if (raw === "") { values[f.key] = ""; continue; }
        const n = Number(raw.replace(/[$,\s]/g, ""));
        if (!Number.isFinite(n) || n < 0) { errors[f.key] = "Enter an amount in USD, e.g. 2,500,000"; continue; }
        values[f.key] = Math.round(n); continue;
      }
      if (f.type === "date" && raw && isNaN(parseDate(raw))) { errors[f.key] = "Enter a valid date."; continue; }
      values[f.key] = raw;
    }
    return { values, errors };
  }

  function showErrors(errors) {
    const form = $("#details-form");
    for (const f of fieldDefs) {
      const el = form.elements[f.key];
      const msg = errors[f.key] || "";
      el.setAttribute("aria-invalid", msg ? "true" : "false");
      $(`#f-${f.key}-err`).textContent = msg;
    }
  }

  const changedKeys = (values) => fieldDefs.map(f => f.key).filter(k => k in values && String(values[k] ?? "") !== String(account[k] ?? ""));

  function isDirty() {
    if (!editing) return false;
    const form = $("#details-form");
    return fieldDefs.some(f => form.elements[f.key].value.trim() !== toInputValue(f, account[f.key]).trim());
  }

  function startEdit(trigger) {
    if (editing) { $("#f-name").focus(); return; }
    editing = true;
    lastEditTrigger = trigger || $("#edit-btn");
    renderForm();
    $("#details-view").hidden = true;
    $("#details-form").hidden = false;
    $("#edit-inline-btn").hidden = true;
    $("#edit-btn").disabled = true;
    $("#details-card").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
    $("#f-name").focus({ preventScroll: true });
  }

  function endEdit() {
    editing = false;
    $("#details-form").hidden = true;
    $("#details-form").innerHTML = "";
    $("#details-view").hidden = false;
    $("#edit-inline-btn").hidden = false;
    $("#edit-btn").disabled = false;
    (lastEditTrigger || $("#edit-btn")).focus();
  }

  function cancelEdit() {
    if (isDirty() && !confirm("Discard your unsaved changes?")) return;
    endEdit();
  }

  function saveEdit(e) {
    e.preventDefault();
    const { values, errors } = readForm();
    showErrors(errors);
    const firstBad = fieldDefs.find(f => errors[f.key]);
    if (firstBad) { $(`#f-${firstBad.key}`).focus(); return; }

    const changed = changedKeys(values);
    if (!changed.length) { endEdit(); toast("No changes to save"); return; }

    Object.assign(account, values);
    const labels = changed.map(k => fieldDefs.find(f => f.key === k).label.replace(/ \(USD\)$/, "").toLowerCase());
    activities.push({
      id: nextId++, type: "update", title: "Updated account details",
      body: `Changed ${listJoin(labels)}.`, at: new Date(), by: CURRENT_USER, contacts: []
    });
    renderAll();
    endEdit();
    toast("Account details saved");
  }

  function renderTimeline() {
    const t = Date.now();

  let composerType = "note";
  const COMPOSER_PLACEHOLDER = {
    note: "Add a note about this account…",
    call: "Summarize the call — outcomes, next steps…",
    email: "Summarize the email you sent or received…",
    meeting: "Who attended and what was decided…"
  };
  function renderComposerContacts() {
    $("#composer-contact").innerHTML = `<option value="">No contact</option>` + contacts.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join("");
  }
  function setComposerType(type) {
    composerType = type;
    document.querySelectorAll("#composer-type button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.type === type)));
    $("#composer-text").placeholder = COMPOSER_PLACEHOLDER[type];
    $("#composer button[type=submit]").textContent = `Log ${TYPE_LABEL[type].toLowerCase()}`;
  }
  function submitComposer(e) {
    e.preventDefault();
    const text = $("#composer-text").value.trim();
    if (!text) { $("#composer-text").focus(); toast("Write something to log first"); return; }
    const cid = $("#composer-contact").value;
    const c = cid && contactById(cid);
    const titles = {
      note: "Note",
      call: c ? `Call with ${c.name}` : "Logged a call",
      email: c ? `Email with ${c.name}` : "Logged an email",
      meeting: c ? `Meeting with ${c.name}` : "Logged a meeting"
    };
    activities.push({ id: nextId++, type: composerType, title: titles[composerType], body: text, at: new Date(), by: CURRENT_USER, contacts: cid ? [cid] : [] });
    $("#composer-text").value = "";
    if (!matches({ type: composerType }, filter)) filter = "all";
    renderFilters(); renderTimeline(); renderContacts();
    toast(`${TYPE_LABEL[composerType]} logged`);
  }

  function renderAll() {
    renderHeader(); renderStats(); renderDetailsView();
    renderContacts(); renderFilters(); renderTimeline();
  }

  // ---------- Wire up ----------
  $("#edit-btn").addEventListener("click", (e) => startEdit(e.currentTarget));
  $("#edit-inline-btn").addEventListener("click", (e) => startEdit(e.currentTarget));
  $("#details-form").addEventListener("submit", saveEdit);
  $("#details-form").addEventListener("click", (e) => { if (e.target.closest("[data-action=cancel]")) cancelEdit(); });
  $("#details-form").addEventListener("keydown", (e) => { if (e.key === "Escape") { e.preventDefault(); cancelEdit(); } });
  $("#details-form").addEventListener("input", (e) => {
    // Clear a field's error as soon as the user edits it.
    if (e.target.getAttribute("aria-invalid") === "true") {
      e.target.setAttribute("aria-invalid", "false");
      $(`#${e.target.id}-err`).textContent = "";
    }
  });
  window.addEventListener("beforeunload", (e) => { if (isDirty()) { e.preventDefault(); e.returnValue = ""; } });

  $("#filters").addEventListener("click", (e) => {
    const b = e.target.closest("[data-filter]");
    if (!b) return;
    filter = b.dataset.filter;
    renderFilters(); renderTimeline();
    $(`[data-filter="${filter}"]`).focus();
  });

  $("#composer-type").addEventListener("click", (e) => {
    const b = e.target.closest("[data-type]");
    if (b) setComposerType(b.dataset.type);
  });
  $("#composer").addEventListener("submit", submitComposer);
  $("#composer-text").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) submitComposer(e);
  });
  $("#log-btn").addEventListener("click", () => {
    $("#composer").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "center" });
    $("#composer-text").focus({ preventScroll: true });
  });

  renderComposerContacts();
  renderAll();
  // Keep relative timestamps fresh.
  setInterval(() => { renderContacts(); renderTimeline(); }, 60000);
})();
</script>
</body>
</html>
