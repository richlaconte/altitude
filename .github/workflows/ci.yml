          node ../scripts/record-check.mjs react18-table-paging node checks/table-paging.mjs
          node ../scripts/record-check.mjs react18-table-bulk node checks/table-bulk.mjs
          node ../scripts/record-check.mjs react18-saved-views node checks/saved-views.mjs
          node ../scripts/record-check.mjs react18-dropzone-queue node checks/dropzone-queue.mjs
          node ../scripts/record-check.mjs react18-filter-groups node checks/filter-groups.mjs
          node ../scripts/record-check.mjs react18-timeline node checks/timeline.mjs
          node ../scripts/record-check.mjs react18-notifications node checks/notifications.mjs
          node ../scripts/record-check.mjs react18-sync-indicator node checks/sync-indicator.mjs
          node ../scripts/record-check.mjs react18-diff-view node checks/diff-view.mjs
          node ../scripts/record-check.mjs react18-save-bar node checks/save-bar.mjs
          node ../scripts/record-check.mjs react18-permission-matrix node checks/permission-matrix.mjs
          node ../scripts/record-check.mjs react18-plan-picker node checks/plan-picker.mjs
          node ../scripts/record-check.mjs react18-feature-gate node checks/feature-gate.mjs
          node ../scripts/record-check.mjs react18-comment-thread node checks/comment-thread.mjs
          node ../scripts/record-check.mjs react18-tour node checks/tour.mjs
          node ../scripts/record-check.mjs react18-prompt-input node checks/prompt-input.mjs
          node ../scripts/record-check.mjs react18-conversation node checks/conversation.mjs
          node ../scripts/record-check.mjs react18-confirmation node checks/confirmation.mjs
          node ../scripts/record-check.mjs react18-trace node checks/trace.mjs
