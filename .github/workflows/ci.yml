# One pipeline for everything, in parallel jobs; the ci job at the end passes only when every one of them did.
#   build:      the design system is in sync with its sources; type-check; the package and its declarations; the
#               shadcn/ui example; Storybook and the landing page.
#   framework:  framework contracts and the installed consumer.
#   checks:     every preview rendered in every scheme and every interaction check (React 18, React 19, StrictMode),
#               split into shards of about equal time by scripts/ci-checks.mjs from build/checks/ci.json. Each shard
#               runs its share one after another, exactly as the single job used to, on a runner of its own.
#   Pushes to main then also: deploy the landing page and Storybook (under /storybook/) to GitHub Pages, and publish to npm if package.json has a new version.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on pull requests, never a deploy or publish already under way on main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  STORYBOOK_DISABLE_TELEMETRY: 1

jobs:
  build:
    name: Sync, package and site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            build/package-lock.json
            examples/shadcn-chart/package-lock.json

      - name: Install
        run: |
          npm ci
          npm ci --prefix build

      # build/checks/ci.json says what the checks jobs run; a check that runs nowhere fails here, before anything else.
      - name: Every check in build/checks runs in CI
        run: node scripts/ci-checks.mjs --check

      # build/ is the kit that produces the design system's bundle and previews (see build/SETUP.md). Rebuilding must
      # change nothing: if it does, someone edited the sources without rebuilding, and project/ is out of date.
      - name: Design system is in sync with its sources
        working-directory: build
        run: |
          npx tsc -p tsconfig.json
          node palette.mjs --check
          node build.mjs
          node previews.mjs
          test -z "$(git ls-files --others --exclude-standard -- ../project)" || { echo "::error::Generated project files must be tracked."; exit 1; }
          git diff --exit-code -- ../project || { echo "::error::project/ is out of date: run 'node build.mjs && node previews.mjs' in build/ and commit the result."; exit 1; }

      - name: Type-check against React 19
        run: npm run typecheck

      - name: Build the package and verify public declarations
        run: |
          npm run build
          node scripts/record-check.mjs package-api node scripts/check-actions-package.mjs

      # Theming.md's shadcn/ui chart setup, built as an app outside the package and read back in every scheme.
      - name: shadcn/ui chart on Altitude's tokens
        working-directory: build
        run: |
          npx playwright-core install --with-deps chromium
          npm ci --prefix ../examples/shadcn-chart
          node ../examples/shadcn-chart/build.mjs
          node ../scripts/record-check.mjs shadcn-chart node checks/shadcn-chart.mjs

      - name: Build Storybook
        run: npm run build-storybook

      # The landing page is served at the Pages root and Storybook under /storybook/.
      - name: Build the landing page
        run: |
          npm run build-site
          cp -r storybook-static site-dist/storybook

      - name: Hand this job's evidence to the ci job
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: alt-05-build
          path: build/test/alt-05/
          retention-days: 1
          if-no-files-found: ignore

      - name: Keep the screenshots of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: preview-screenshots-build
          path: build/test/shot-*.png
          if-no-files-found: ignore

      # Deployed by the pages job, which waits for the ci job: nothing is deployed unless every check passed.
      - name: Hand the site to the Pages deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site-dist

  framework:
    name: Framework contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            build/package-lock.json
            examples/shadcn-chart/package-lock.json

      - name: Install
        run: |
          npm ci
          npm ci --prefix build

      - name: Framework contracts and installed consumer
        run: |
          npx --prefix build playwright-core install --with-deps chromium
          npm run build
          npm run check:framework

      - name: Keep framework contract evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: framework-contract-evidence
          path: |
            build/test/framework-consumer/result.json
            build/test/framework-accessibility/
            build/test/framework-sizes.json
          if-no-files-found: warn

  checks:
    name: Checks ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    strategy:
      # Every shard runs to the end, so one run reports every failure. More shards: add a number here; the split follows.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            build/package-lock.json
            examples/shadcn-chart/package-lock.json

      - name: Install
        run: |
          npm ci
          npm ci --prefix build

      - name: Set up the render kit (build/SETUP.md, "One-time setup")
        working-directory: build
        run: |
          npx playwright-core install --with-deps chromium
          mkdir -p test
          cp node_modules/react/umd/react.production.min.js node_modules/react-dom/umd/react-dom.production.min.js test/
          python3 tokcss.py ../project/tokens.json test/tokens.css

      # node scripts/ci-checks.mjs --plan 1/6 prints what each shard runs.
      - name: Render previews and run the interaction checks
        run: node scripts/ci-checks.mjs ${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Hand this shard's evidence to the ci job
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: alt-05-checks-${{ matrix.shard }}
          path: build/test/alt-05/
          retention-days: 1
          if-no-files-found: ignore

      # Only the shard that ran the focused renders has these.
      - name: Hand the focused renders' screenshots to the ci job
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: renders-evidence-shots
          path: build/test/evidence-shots/
          retention-days: 1
          if-no-files-found: ignore

      - name: Keep the screenshots of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: preview-screenshots-${{ matrix.shard }}
          path: build/test/shot-*.png
          if-no-files-found: ignore

  # The one status to wait for. It also puts the jobs' evidence back together as the single artifact it always was.
  ci:
    if: ${{ !cancelled() }}
    needs: [build, framework, checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            build/package-lock.json
            examples/shadcn-chart/package-lock.json

      - name: Install
        run: |
          npm ci
          npm ci --prefix build

      - name: Collect the jobs' evidence
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: alt-05-*
          path: parts

      - name: Collect the focused renders' screenshots
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: renders-evidence-shots
          path: build/test

      - name: One record of the evidence, in the order the checks ran
        run: node scripts/record-check.mjs --merge parts/*

      - name: Keep Actions in place acceptance evidence
        uses: actions/upload-artifact@v7
        with:
          name: actions-in-place-evidence
          path: |
            build/test/alt-05/
            build/test/shot-InlineEdit-*.png
            build/test/shot-Dialog-*.png
            build/test/shot-ActionsInPlace-*.png
          if-no-files-found: warn

      - name: Every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to push the version tag
      id-token: write   # npm trusted publishing: no npm token is stored in this repository
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Is this version new?
        id: version
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version > /dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "$name@$version is already on npm; bump the version in package.json to publish."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.version.outputs.new == 'true'
        run: |
          npm ci
          npm run build

      - name: Publish to npm
        if: steps.version.outputs.new == 'true'
        run: |
          # Trusted publishing needs npm 11.5.1 or later.
          npm install -g npm@12.2.0
          # Provenance checks that the package says which repository built it.
          npm pkg set repository.type=git "repository.url=git+https://github.com/${GITHUB_REPOSITORY}.git" "homepage=https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          npm publish --access public

      - name: Tag the release
        if: steps.version.outputs.new == 'true'
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
