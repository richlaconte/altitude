          node ../scripts/record-check.mjs react18-agent-action-pattern node checks/agent-action-pattern.mjs
          node ../scripts/record-check.mjs react18-onboarding-pattern node checks/onboarding-pattern.mjs
          node ../scripts/record-check.mjs react18-chart-patterns node checks/chart-patterns.mjs
          node ../scripts/record-check.mjs react18-bar-chart node checks/bar-chart.mjs
          node ../scripts/record-check.mjs react18-line-chart node checks/line-chart.mjs
          node ../scripts/record-check.mjs react18-area-chart node checks/area-chart.mjs
          node ../scripts/record-check.mjs react18-chart-tooltip node checks/chart-tooltip.mjs
          node ../scripts/record-check.mjs react18-chart-legend node checks/chart-legend.mjs
          node ../scripts/record-check.mjs react18-chart-keyboard node checks/chart-keyboard.mjs
          node ../scripts/record-check.mjs react18-chart-table node checks/chart-table.mjs
          node ../scripts/record-check.mjs react18-chart-loading node checks/chart-loading.mjs
          node ../scripts/record-check.mjs react18-chart-status node checks/chart-status.mjs
          node ../scripts/record-check.mjs react18-chart-reference node checks/chart-reference.mjs
          node ../scripts/record-check.mjs react18-chart-live node checks/chart-live.mjs
          node ../scripts/record-check.mjs react18-chart-filter node checks/chart-filter.mjs
          node ../scripts/record-check.mjs react18-chart-select node checks/chart-select.mjs
          node ../scripts/record-check.mjs react18-sparkline node checks/sparkline.mjs
          node ../scripts/record-check.mjs react18-stat node checks/stat.mjs
          node ../scripts/record-check.mjs react18-meter node checks/meter.mjs
          node ../scripts/record-check.mjs react18-bar-list node checks/bar-list.mjs
          node ../scripts/record-check.mjs react18-heatmap node checks/heatmap.mjs
          node ../scripts/record-check.mjs react18-scatter-chart node checks/scatter-chart.mjs
          node ../scripts/record-check.mjs react18-range-slider node checks/range-slider.mjs
          node ../scripts/record-check.mjs react18-chart-brush node checks/chart-brush.mjs
          node ../scripts/record-check.mjs chart-themes node checks/chart-themes.mjs
          DPR=2 FORCED=1 node shoot.mjs ChartContainer,ChartMotion,ChartPatterns,BarChart,LineChart,AreaChart,ChartTooltip,ChartLegend,ChartTable,ChartLoading,ChartStatus,ChartReference,ChartLive,ChartFilter,ChartSelect,ChartBrush,Sparkline,Stat,Meter,BarList daylight 960
          DPR=2 node shoot.mjs InlineEdit,Dialog,ActionsInPlace daylight,nightfall,mesa,alpine 320
          DPR=2 FORCED=1 node shoot.mjs InlineEdit,Dialog,ActionsInPlace daylight 960

      - name: React 19 runtime and StrictMode regressions
        run: |
          node scripts/build-check-fixtures.mjs
          ALT_FIXTURE_ROOT="$PWD/build/test/react19" node scripts/record-check.mjs react19-modal node build/checks/modal-lifecycle.mjs
          ALT_FIXTURE_ROOT="$PWD/build/test/react19" node scripts/record-check.mjs react19-inline node build/checks/inline-edit.mjs
          ALT_FIXTURE_ROOT="$PWD/build/test/react19" node scripts/record-check.mjs react19-actions node build/checks/actions-in-place.mjs
          ALT_FIXTURE_ROOT="$PWD/build/test/react19" node scripts/record-check.mjs react19-item-group node build/checks/item-group.mjs
          ALT_FIXTURE_ROOT="$PWD/build/test/react19" node scripts/record-check.mjs react19-board-edit node build/checks/board-edit.mjs
          ALT_FIXTURE_ROOT="$PWD/build/test/react19" node scripts/record-check.mjs react19-table-editing node build/checks/table-editing.mjs
          ALT_FIXTURE_ROOT="$PWD/build/test/react19" node scripts/record-check.mjs react19-property-list node build/checks/property-list.mjs
          ALT_FIXTURE_ROOT="$PWD/build/test/react19" node scripts/record-check.mjs react19-edit-region node build/checks/edit-region.mjs
          ALT_FIXTURE_ROOT="$PWD/build/test/react19" node scripts/record-check.mjs react19-tag-input node build/checks/tag-input.mjs
          ALT_FIXTURE_ROOT="$PWD/build/test/react19" node scripts/record-check.mjs react19-date-picker node build/checks/date-picker.mjs
          ALT_FIXTURE_ROOT="$PWD/build/test/react19" node scripts/record-check.mjs react19-tree node build/checks/tree.mjs
          ALT_FIXTURE_ROOT="$PWD/build/test/react19" node scripts/record-check.mjs react19-checklist node build/checks/checklist.mjs
          ALT_FIXTURE_ROOT="$PWD/build/test/react19" node scripts/record-check.mjs react19-filter-bar node build/checks/filter-bar.mjs
          ALT_FIXTURE_ROOT="$PWD/build/test/react19" node scripts/record-check.mjs react19-schedule node build/checks/schedule.mjs
          ALT_FIXTURE_ROOT="$PWD/build/test/react19" node scripts/record-check.mjs react19-data-grid node build/checks/data-grid.mjs
          ALT_CHECK_STRICT=1 node scripts/build-check-fixtures.mjs
          ALT_FIXTURE_ROOT="$PWD/build/test/react19-strict" node scripts/record-check.mjs strict-modal node build/checks/modal-lifecycle.mjs
          ALT_FIXTURE_ROOT="$PWD/build/test/react19-strict" node scripts/record-check.mjs strict-inline node build/checks/inline-edit.mjs
          ALT_FIXTURE_ROOT="$PWD/build/test/react19-strict" node scripts/record-check.mjs strict-item-group node build/checks/item-group.mjs
          ALT_FIXTURE_ROOT="$PWD/build/test/react19-strict" node scripts/record-check.mjs strict-board-edit node build/checks/board-edit.mjs
          ALT_FIXTURE_ROOT="$PWD/build/test/react19-strict" node scripts/record-check.mjs strict-table-editing node build/checks/table-editing.mjs
          ALT_FIXTURE_ROOT="$PWD/build/test/react19-strict" node scripts/record-check.mjs strict-property-list node build/checks/property-list.mjs
          ALT_FIXTURE_ROOT="$PWD/build/test/react19-strict" node scripts/record-check.mjs strict-edit-region node build/checks/edit-region.mjs
          ALT_FIXTURE_ROOT="$PWD/build/test/react19-strict" node scripts/record-check.mjs strict-tag-input node build/checks/tag-input.mjs
          ALT_FIXTURE_ROOT="$PWD/build/test/react19-strict" node scripts/record-check.mjs strict-date-picker node build/checks/date-picker.mjs
          ALT_FIXTURE_ROOT="$PWD/build/test/react19-strict" node scripts/record-check.mjs strict-tree node build/checks/tree.mjs
          ALT_FIXTURE_ROOT="$PWD/build/test/react19-strict" node scripts/record-check.mjs strict-checklist node build/checks/checklist.mjs
          ALT_FIXTURE_ROOT="$PWD/build/test/react19-strict" node scripts/record-check.mjs strict-filter-bar node build/checks/filter-bar.mjs
          ALT_FIXTURE_ROOT="$PWD/build/test/react19-strict" node scripts/record-check.mjs strict-schedule node build/checks/schedule.mjs
          ALT_FIXTURE_ROOT="$PWD/build/test/react19-strict" node scripts/record-check.mjs strict-data-grid node build/checks/data-grid.mjs


      - name: Type-check against React 19
        run: npm run typecheck

      - name: Build the package and verify public declarations
        run: |
          npm run build
          node scripts/record-check.mjs package-api node scripts/check-actions-package.mjs

      # Theming.md's shadcn/ui chart setup, built as an app outside the package and read back in every scheme.
      - name: shadcn/ui chart on Altitude's tokens
        working-directory: build
        run: |
          npm ci --prefix ../examples/shadcn-chart
          node ../examples/shadcn-chart/build.mjs
          node ../scripts/record-check.mjs shadcn-chart node checks/shadcn-chart.mjs

      - name: Framework contracts and installed consumer
        run: npm run check:framework

      - name: Build Storybook
        run: npm run build-storybook

      # The landing page is served at the Pages root and Storybook under /storybook/.
      - name: Build the landing page
        run: |
          npm run build-site
          cp -r storybook-static site-dist/storybook

      - name: Keep Actions in place acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: actions-in-place-evidence
          path: |
            build/test/alt-05/
            build/test/shot-InlineEdit-*.png
            build/test/shot-Dialog-*.png
            build/test/shot-ActionsInPlace-*.png
          if-no-files-found: warn

      - name: Keep framework contract evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: framework-contract-evidence
          path: |
            build/test/framework-consumer/result.json
            build/test/framework-accessibility/
            build/test/framework-sizes.json
          if-no-files-found: warn

      - name: Keep the screenshots of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: preview-screenshots
          path: build/test/shot-*.png
          if-no-files-found: ignore

      - name: Hand the site to the Pages deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site-dist

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to push the version tag
      id-token: write   # npm trusted publishing: no npm token is stored in this repository
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Is this version new?
        id: version
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version > /dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "$name@$version is already on npm; bump the version in package.json to publish."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.version.outputs.new == 'true'
        run: |
          npm ci
          npm run build

      - name: Publish to npm
        if: steps.version.outputs.new == 'true'
        run: |
          # Trusted publishing needs npm 11.5.1 or later.
          npm install -g npm@12.2.0
          # Provenance checks that the package says which repository built it.
          npm pkg set repository.type=git "repository.url=git+https://github.com/${GITHUB_REPOSITORY}.git" "homepage=https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          npm publish --access public

      - name: Tag the release
        if: steps.version.outputs.new == 'true'
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
