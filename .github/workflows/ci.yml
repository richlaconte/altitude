# One pipeline for everything.
#   Every push and pull request: check the design system is in sync with its sources, render every preview in every
#   scheme, run the interaction checks, and build the package and Storybook.
#   Pushes to main then also: deploy the landing page and Storybook (under /storybook/) to GitHub Pages, and publish to npm if package.json has a new version.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on pull requests, never a deploy or publish already under way on main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  STORYBOOK_DISABLE_TELEMETRY: 1

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            build/package-lock.json
            examples/shadcn-chart/package-lock.json

      - name: Install
        run: |
          npm ci
          npm ci --prefix build

      # build/ is the kit that produces the design system's bundle and previews (see build/SETUP.md). Rebuilding must
      # change nothing: if it does, someone edited the sources without rebuilding, and project/ is out of date.
      - name: Design system is in sync with its sources
        working-directory: build
        run: |
          npx tsc -p tsconfig.json
          node palette.mjs --check
          node build.mjs
          node previews.mjs
          test -z "$(git ls-files --others --exclude-standard -- ../project)" || { echo "::error::Generated project files must be tracked."; exit 1; }
          git diff --exit-code -- ../project || { echo "::error::project/ is out of date: run 'node build.mjs && node previews.mjs' in build/ and commit the result."; exit 1; }

      - name: Render every preview in every scheme, and run the interaction checks
        working-directory: build
        run: |
          npx playwright-core install --with-deps chromium
          mkdir -p test
          cp node_modules/react/umd/react.production.min.js node_modules/react-dom/umd/react-dom.production.min.js test/
          python3 tokcss.py ../project/tokens.json test/tokens.css
          node shoot.mjs "" daylight,nightfall,mesa,alpine 960
          node checks/approach-and-lamps.mjs
          node checks/field-focus.mjs
          node checks/avatar.mjs
          node ../scripts/record-check.mjs react18-modal node checks/modal-lifecycle.mjs
          node ../scripts/record-check.mjs react18-inline node checks/inline-edit.mjs
          node ../scripts/record-check.mjs react18-actions node checks/actions-in-place.mjs
          node ../scripts/record-check.mjs react18-item-group node checks/item-group.mjs
          node ../scripts/record-check.mjs react18-board-edit node checks/board-edit.mjs
          node ../scripts/record-check.mjs react18-table-editing node checks/table-editing.mjs
          node ../scripts/record-check.mjs react18-property-list node checks/property-list.mjs
          node ../scripts/record-check.mjs react18-edit-region node checks/edit-region.mjs
          node ../scripts/record-check.mjs react18-tag-input node checks/tag-input.mjs
          node ../scripts/record-check.mjs react18-date-picker node checks/date-picker.mjs
          node ../scripts/record-check.mjs react18-date-presets node checks/date-presets.mjs
          node ../scripts/record-check.mjs react18-tree node checks/tree.mjs
          node ../scripts/record-check.mjs react18-checklist node checks/checklist.mjs
          node ../scripts/record-check.mjs react18-filter-bar node checks/filter-bar.mjs
          node ../scripts/record-check.mjs react18-schedule node checks/schedule.mjs
          node ../scripts/record-check.mjs react18-data-grid node checks/data-grid.mjs
          node ../scripts/record-check.mjs react18-data-palette node checks/data-palette.mjs
          node ../scripts/record-check.mjs react18-chart-motion node checks/chart-motion.mjs
          node ../scripts/record-check.mjs react18-hold-button node checks/hold-button.mjs
          node ../scripts/record-check.mjs react18-separator node checks/separator.mjs
          node ../scripts/record-check.mjs react18-link node checks/link.mjs
          node ../scripts/record-check.mjs react18-formatted-number node checks/formatted-number.mjs
          node ../scripts/record-check.mjs react18-relative-time node checks/relative-time.mjs
          node ../scripts/record-check.mjs react18-copy-button node checks/copy-button.mjs
          node ../scripts/record-check.mjs react18-toggle node checks/toggle.mjs
          node ../scripts/record-check.mjs react18-toolbar node checks/toolbar.mjs
          node ../scripts/record-check.mjs react18-split-button node checks/split-button.mjs
          node ../scripts/record-check.mjs react18-number-input node checks/number-input.mjs
          node ../scripts/record-check.mjs react18-input-otp node checks/input-otp.mjs
          node ../scripts/record-check.mjs react18-time-input node checks/time-input.mjs
          node ../scripts/record-check.mjs react18-password-input node checks/password-input.mjs
          node ../scripts/record-check.mjs react18-secret-field node checks/secret-field.mjs
          node ../scripts/record-check.mjs react18-code-block node checks/code-block.mjs
          node ../scripts/record-check.mjs react18-color-picker node checks/color-picker.mjs
          node ../scripts/record-check.mjs react18-breadcrumb node checks/breadcrumb.mjs
