          node ../scripts/record-check.mjs react18-property-proposals node checks/property-proposals.mjs
          node ../scripts/record-check.mjs react18-ai-label node checks/ai-label.mjs
          node ../scripts/record-check.mjs react18-inline-citation node checks/inline-citation.mjs
          node ../scripts/record-check.mjs react18-settings-pattern node checks/settings-pattern.mjs
          node ../scripts/record-check.mjs react18-members-pattern node checks/members-pattern.mjs
          node ../scripts/record-check.mjs react18-billing-pattern node checks/billing-pattern.mjs
          node ../scripts/record-check.mjs react18-auth-pattern node checks/auth-pattern.mjs
          node ../scripts/record-check.mjs react18-audit-log-pattern node checks/audit-log-pattern.mjs
          node ../scripts/record-check.mjs react18-import-pattern node checks/import-pattern.mjs
